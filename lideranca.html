<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas Performance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./lideranca.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-block">
        <div class="brand-kicker">Atlas Performance</div>
        <h1>Gestao de performance com leitura clara, risco visivel e acao pratica.</h1>
        <p>Uma plataforma para gestores acompanharem Players, Score, ninebox, historico e desenvolvimento.</p>
      </div>

      <nav class="sidebar-nav" aria-label="Principal">
        <button class="nav-link active" data-view="dashboard">Dashboard</button>
        <button class="nav-link" data-view="players">Players</button>
        <button class="nav-link" data-view="player">Player</button>
        <button class="nav-link" data-view="ninebox">Ninebox</button>
        <button class="nav-link" data-view="relatorios">Relatorios</button>
        <button class="nav-link" data-view="academy">Academy</button>
      </nav>

      <div class="sidebar-footer">
        <div class="footer-label">Sessao</div>
        <div id="user-summary"></div>
        <button id="logout-btn" class="ghost-button">Sair</button>
      </div>
    </aside>

    <main class="content">
      <header class="topbar">
        <div>
          <div class="eyebrow">Sistema operacional de gestao</div>
          <h2 id="page-title">Dashboard</h2>
        </div>

        <div class="topbar-actions">
          <button id="refresh-btn" class="secondary-button">Atualizar visao</button>
          <div id="save-indicator" class="save-indicator">Dados sincronizados</div>
        </div>
      </header>

      <section id="hero-card" class="hero-card"></section>
      <section id="page-content" class="page-content"></section>
    </main>
  </div>

  <script src="./lideranca.js"></script>
</body>
</html>
